plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'in.termedu.app'
    compileSdk 36

    defaultConfig {
        applicationId "in.termedu.app"
        minSdk 24
        targetSdk 36
        versionCode 15

        versionName "1.15"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 🔐 SIGNING CONFIG (IMPORTANT)
    signingConfigs {
        release {
            storeFile file("termedu-release.jks")
            storePassword "***REMOVED***"
            keyAlias "termedu"
            keyPassword "***REMOVED***"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release   // ✅ REQUIRED
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation 'androidx.activity:activity:1.9.3'
    implementation libs.constraintlayout
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.github.UnifiedPush:android-connector:2.4.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // Volley
    implementation 'com.android.volley:volley:1.2.1'
}